name: Publicar
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar versión y JSON
        shell: bash
        run: |
          set -eu
          version=$(jq -r .version module.json)
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "La etiqueta no coincide con module.json ($version)."
            exit 1
          fi
          for file in module.json lang/*.json compendium/*.json; do jq empty "$file"; done
          for file in scripts/*.mjs; do node --check "$file"; done
          jq -r '.esmodules[], .styles[], .languages[].path, (.packs[].path + "/CURRENT")' module.json |
            while read -r file; do test -f "$file"; done
      - name: Empaquetar
        run: |
          mkdir -p dist
          zip -qr dist/mr-mausritter-es.zip module.json scripts styles lang compendium packs assets LICENSE LICENSE-DAMAGE-HELPER.txt NOTICE.md
          unzip -tq dist/mr-mausritter-es.zip
          unzip -Z1 dist/mr-mausritter-es.zip > dist/contenido.txt
          grep -qx module.json dist/contenido.txt
          grep -qx scripts/combat.mjs dist/contenido.txt
          grep -qx packs/requeson/CURRENT dist/contenido.txt
          grep -qx packs/reservoir/CURRENT dist/contenido.txt
      - name: Notas
        run: |
          version=$(jq -r .version module.json)
          awk -v version="$version" '$0 == "## "version { show=1; next } /^## / { show=0 } show' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          version=$(jq -r .version module.json)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/mr-mausritter-es.zip module.json --clobber
            gh release edit "$tag" --notes-file dist/notes.md
          else
            gh release create "$tag" dist/mr-mausritter-es.zip module.json --target "$GITHUB_SHA" \
              --title "MR- Mausritter en español v$version" --notes-file dist/notes.md
          fi
